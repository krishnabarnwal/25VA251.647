<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4: Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Marks Calculator</h2>
        
        <div id="step1">
            <label for="numSubjects">Enter Total Number of Subjects:</label>
            <input type="number" id="numSubjects" min="1" placeholder="e.g., 5">
            <button onclick="generateSubjectInputs()">Next</button>
        </div>

        <div id="step2" style="display: none;">
            <div id="subjectInputs"></div>
            <button onclick="calculateResults()">Calculate Results</button>
        </div>
        
        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
