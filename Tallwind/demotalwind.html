<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Background Image</title>
</head>

<body>

  <!-- 
    Put your image inside an "images" folder
    Example:
    project/
      index.html
      images/
        flower.jpg
  -->

  <div
    class="h-screen bg-cover bg-center flex flex-col items-center justify-center gap-4"
    style="background-image: url('./images/flower.jpg');"
  >

    <button class="bg-blue-500 text-white px-5 py-2 rounded-lg">
      Button A
    </button>

    <button class="bg-cyan-500 text-white px-5 py-2 rounded-lg">
      Button B
    </button>

    <button class="bg-pink-500 text-white px-5 py-2 rounded-lg">
      Button C
    </button>

    <button class="bg-sky-500/100 text-white px-5 py-2 rounded-lg">
      100%
    </button>

    <button class="bg-sky-500/75 text-white px-5 py-2 rounded-lg">
      75%
    </button>

    <button class="bg-sky-500/50 text-white px-5 py-2 rounded-lg">
      50%
    </button>

    <h1 class="text-5xl font-bold text-white">
      Hello World!
    </h1>

  </div>

</body>
</html>
